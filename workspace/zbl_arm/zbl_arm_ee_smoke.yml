# Smoke variant of zbl_arm_ee.yml: single GPU, 1 epoch, no wandb, no mid-run
# checkpoint churn. Used to validate the full train path (data -> collator ->
# FSDP -> loss) before committing to the 8xA100 run. All paths identical to
# zbl_arm_ee.yml so generated artifacts land in the same places.

model_type: qwen2_5

task:
  dof_config:
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 16
  ar_dof_config:
    follow_right_ee_cartesian_pos_relative: 3
    follow_right_ee_rotation_6D_relative: 6
    follow_right_gripper: 1
    action_padding: 16
  agent_pos_config:
    follow_right_ee_cartesian_pos: 3
    follow_right_ee_rotation_6D: 6
    follow_right_gripper: 1
    action_padding: 16
  action_horizon: 32
  action_horizon_flow: 32
  use_state_string_representation: false

model:
  backbone: qwen2_5
  config_path: /root/workspace/wall-x/checkpoints/wall-oss-0.5/config.json
  processor_path: /root/workspace/wall-x/checkpoints/Qwen2.5-VL-3B-Instruct
  pretrained_path: /root/workspace/wall-x/checkpoints/Qwen2.5-VL-3B-Instruct
  attn_deterministic: true
  use_ema: false
  flow_loss_weight: 1.0
  ar_loss_weight: 0.01

hyperparams:
  num_epoch: 1
  batch_size_per_gpu: 1
  gradient_accumulation_steps: 1
  seed: 10222
  optimizer:
    optimizer_type: adamw
    learning_rate: 5.0e-05
    max_grad_norm: 1.0
    enable_grad_clip: true
    betas: [0.9, 0.95]
    weight_decay: 1.0e-8
    eps: 1.0e-8
  scheduler:
    scheduler_type: cosine
    num_warmup_steps: 1000
    num_training_steps: 200000
    min_lr: 1.0e-6

distributed:
  use_fsdp: true
  use_mixed_precision: true
  bf16: true

data:
  dataset_type: lerobot
  lerobot_config:
    repo_id: /root/workspace/wall-x/data/zbl_data/pick_up_test_tube_No_1_from_the_left_rack_and_place_it_in_the_right_rack
    root: null
  key_mappings:
    camera:
      observation.images.wrist: right_wrist_view
    state: observation.state
    action: action
  norm_stats_path: /root/workspace/wall-x/data/norm_stats.json
  # floor(1 episode * 0.95) == 0 train episodes; use 1.0 for the single-episode
  # smoke run. Restore 0.95 once the dataset has a few dozen episodes.
  train_test_split: 1.0
  num_workers: 0
  max_length: 1024
  resolution:
    right_wrist_view: 448

logging:
  log_name: zbl_arm_ee_smoke
  log_project: zbl_arm_finetune
  log_entity: ""
  use_wandb: false
  log_interval: 5
  save_interval: 1000000
  val_interval: 1000000
  epoch_save_interval: 1

checkpoint:
  save_path: /root/workspace/wall-x/output_smoke
  resume_from: /root/workspace/wall-x/checkpoints/wall-oss-0.5/model.safetensors

debug:
  profile: false
  nvtx: false
